<!DOCTYPE html>
<html lang="vi">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Quiz App</title>

  <style>
    /* Giao diện thanh nhảy câu hỏi bên trái */
    .quiz-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .quiz-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Thanh Nav bây giờ là một LAYER đè lên */
    .nav-panel {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      background: rgba(30, 41, 59, 0.95);
      /* Màu nền đậm có độ trong suốt nhẹ */
      padding: 20px;
      border-radius: 15px;

      /* BIẾN THÀNH LAYER ĐÈ LÊN */
      position: absolute;
      top: 50px;
      left: 0;
      z-index: 999;
      /* Đảm bảo luôn nằm trên cùng */

      width: 280px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #3b82f6;
      backdrop-filter: blur(5px);
      /* Làm mờ nhẹ nền phía dưới layer */
    }

    /* Khi đóng layer */
    .nav-panel.collapsed {
      display: none;
    }

    /* Nút đóng/mở layer */
    .toggle-nav-btn {
      background: #3b82f6;
      color: white;
      padding: 8px 15px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
      display: inline-block;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }

    /* TRẠNG THÁI 1: Mặc định chưa làm - Màu Xám */
    .nav-item {
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #334155;
      /* Màu xám tro */
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    /* Viền vàng cho câu đang xem */
    .nav-item.active {
      outline: 2px solid #fbbf24;
      z-index: 1;
    }

    /* TRẠNG THÁI 2: Đã chọn đáp án (Đang thi) - Màu Xanh nước biển */
    .nav-item.done {
      background: #2563eb !important;
      color: #ffffff !important;
      border-color: #60a5fa !important;
    }

    /* TRẠNG THÁI 3: Đã nộp bài - Màu Xanh lá (Đúng) / Đỏ (Sai) */
    .nav-item.correct {
      background: #064e3b !important;
      color: #a7f3d0 !important;
      border-color: #10b981 !important;
    }

    .nav-item.wrong {
      background: #7f1d1d !important;
      color: #fecaca !important;
      border-color: #ef4444 !important;
    }

    /* Đồng hồ đếm ngược */
    #timer {
      font-size: 24px;
      font-weight: bold;
      color: #ef4444;
      text-align: center;
      margin-bottom: 15px;
      font-family: monospace;
      /* Thêm dòng dưới đây để giữ chỗ cố định */
      min-height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Nút điều hướng Tiến/Lùi */
    .nav-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .nav-btns button {
      flex: 1;
      background: #475569;
    }

    /* Option dạng Checkbox giả */
    .option.selected {
      border-color: #3b82f6;
      background: #1e3a8a;
    }

    /* Thanh tiến trình chạy ở phía trên cùng của Card */
    .progress-container {
      width: 100%;
      background-color: #334155;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(to right, #3b82f6, #60a5fa);
      width: 0%;
      /* Sẽ cập nhật bằng JS */
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 14px;
      color: #94a3b8;
      text-align: right;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .hover-word {
      display: inline-block;
      transition: all 0.2s ease-in-out;
      transform-origin: center center;
      margin: 0 1px;
      letter-spacing: normal;
      /* Khoảng cách chữ cái mặc định */
    }

    @media (hover: hover) {
      .hover-word:hover {
        transform: scale(1.2) translateY(-2px);
        color: #60a5fa;
        margin: 0 6px;
        /* Giãn cách giữa các từ */

        /* 🌟 ĐÂY LÀ DÒNG GIÃN CÁCH CÁC CHỮ CÁI BÊN TRONG TỪ 🌟 */
        letter-spacing: 1.5px;

        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        cursor: default;
      }
    }

    /* =========================================
   BỔ SUNG: GIAO DIỆN FULL MÀN HÌNH CHO MÁY TÍNH (DESKTOP)
   ========================================= */
    /* Khi thẻ body có class 'is-desktop' (do JS gắn vào) */
    .is-desktop .card {
      max-width: 96%;
      width: 100%;
      min-height: 90vh;
      padding: 40px 50px;
    }

    /* Khung chứa các đáp án */
    .is-desktop #ans {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 30px;
    }

    .is-desktop .option {
      margin: 0;
      height: 100%;
      padding: 24px;
      font-size: 18px;
    }

    /* Thêm gợi ý phím tắt mờ nhạt ở góc phải của đáp án khi dùng máy tính */
    .is-desktop .option:nth-child(1)::after {
      content: "Phím 1";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    .is-desktop .option:nth-child(2)::after {
      content: "Phím 2";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    .is-desktop .option:nth-child(3)::after {
      content: "Phím 3";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    .is-desktop .option:nth-child(4)::after {
      content: "Phím 4";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    /* Tùy chỉnh thêm khoảng cách của câu hỏi cho cân đối với khung to */
    .is-desktop .q {
      font-size: 24px;
      margin-bottom: 30px;
    }

    * {
      box-sizing: border-box
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      /* Nền web màu xanh đen cực đậm */
      color: #f8fafc;
      /* Màu chữ xám trắng */
      margin: 0;
      padding: 0;
    }

    .q {
      font-size: 27px;
      font-weight: 600;
      line-height: 1.5;
      margin: 20px 0 15px;
      padding: 10px 0;
      color: #f8fafc;
      /* Chữ câu hỏi màu trắng/xám sáng */
    }

    /* Hiệu ứng phóng to và nổi bật khi di chuột vào đáp án (Chỉ hoạt động trên thiết bị có chuột) */
    @media (hover: hover) {
      .option:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        /* Bóng đổ đậm hơn cho dark mode */
        border-color: #64748b;
        /* Viền sáng lên một chút khi hover */
        background: #334155;
        /* Nền khối đáp án sáng lên nhẹ khi hover */
      }
    }

    /* FULL MOBILE CARD */
    .card {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #1e293b;
      /* Nền khung làm bài xanh đen nhạt hơn nền web 1 xíu để tách biệt */
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* TITLE */
    h2 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 15px;
      color: #f8fafc;
    }

    /* CHAPTER BUTTON */
    .chaps {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .chap {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      background: #334155;
      /* Khối chương chưa chọn màu xám tro */
      color: #94a3b8;
      /* Chữ xám nhạt */
      border: 2px solid #475569;
      border-radius: 12px;
      font-size: 23px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chap.active {
      background: #1e3a8a;
      /* Xanh dương đậm khi active */
      color: #60a5fa;
      /* Chữ xanh dương sáng */
      border: 2px solid #3b82f6;
      /* Viền xanh dương dạ quang */
    }

    /* SLIDER */
    .slider-wrap {
      position: relative;
      margin: 30px 0;
    }

    #slider {
      width: 100%;
      height: 10px;
      border-radius: 10px;
      appearance: none;
      background: #334155;
      /* Thanh trượt nền tối */
    }

    #slider::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #3b82f6;
      /* Nút trượt xanh dương chói */
      cursor: pointer;
      margin-top: -6px;
    }

    /* VALUE FLOAT */
    #val {
      position: absolute;
      top: -32px;
      transform: translateX(-50%);
      background: #3b82f6;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    /* OPTIONS */
    .option {
      background: #1e293b;
      /* Nền khối đáp án đồng màu với Card */
      color: #cbd5e1;
      /* Chữ đáp án xám trắng */
      padding: 18px 16px;
      margin: 14px 0;
      border-radius: 18px;
      font-size: 26px;
      line-height: 1.4;
      min-height: 150px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: 0.15s;
      border: 2px solid #334155;
      /* Viền phân cách xám đen */
    }

    /* hiệu ứng bấm */
    .option:active {
      transform: scale(0.97);
    }

    .option.correct {
      background: #064e3b;
      /* Nền xanh lục sẫm khi đúng */
      color: #a7f3d0;
      /* Chữ xanh lợt khi đúng */
      border-color: #10b981;
      /* Viền xanh dạ quang */
    }

    .option.wrong {
      background: #7f1d1d;
      /* Nền đỏ bầm khi sai */
      color: #fecaca;
      /* Chữ hồng nhạt khi sai */
      border-color: #ef4444;
      /* Viền đỏ chót */
    }

    /* BUTTON */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 16px;
      background: #3b82f6;
      /* Nút xanh dương dạ quang */
      color: white;
      font-size: 23px;
      font-weight: bold;
      cursor: pointer;
    }

    /* SAFE AREA (iphone) */
    @supports(padding:max(0px)) {
      .card {
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
    }

    /* Bộ nút điều hướng cố định ở đáy màn hình */
    .nav-btns-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 15px;
      padding: 15px 20px;
      z-index: 1000;
      /* Luôn nằm trên cùng */
      max-width: 800px;
      margin: 0 auto;
    }

    .nav-btns-fixed button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      background: #475569;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    /* Thêm khoảng trống ở dưới cùng của nội dung câu hỏi để không bị nút đè lên chữ cuối */
    .quiz-main-content {
      padding-bottom: 100px;
    }

    .exit-btn {
      position: absolute;
      top: 0px;
      left: 0px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }

    .exit-btn:hover {
      background: #dc2626;
      transform: scale(1.05);
    }

    .exit-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>

<body>

  <script>
    document.addEventListener('keydown', function (event) {
      if (!isExam && !isFinished) return;
      const options = document.querySelectorAll('.option');
      const isAnswered = document.querySelector('.option.correct') || document.querySelector('.option.wrong');

      // Chuyển đổi phím bấm thành chữ thường để tránh lỗi Caps Lock
      const key = event.key.toLowerCase();

      // --- PHÍM TẮT MỚI GÁN THEO YÊU CẦU ---
      if (key === 'q') {
        toggleNav(); // Mở/Đóng Layer Nav
      }
      if (key === 'w') {
        prevQ(); // Lùi câu
      }
      if (key === 'e') {
        nextQ(); // Tiến câu
      }

      // --- CHỌN ĐÁP ÁN (1, 2, 3, 4) ---
      if (options.length === 4 && !isAnswered && !isFinished) {
        if (key === '1') options[0].click();
        if (key === '2') options[1].click();
        if (key === '3') options[2].click();
        if (key === '4') options[3].click();
      }

      // Bấm Enter để bắt đầu hoặc làm lại
      if (event.key === 'Enter') {
        const btn = document.querySelector('button');
        if (btn && (btn.innerText.includes('Bắt đầu') || btn.innerText.includes('Làm lại'))) {
          btn.click();
        }
      }
    });

["99. VoIP (Voice over Internet Protocol) là?", ["Truyền giọng nói của con người (thoại) qua mạng thông tin sử dụng bộ giao thức TCP/IP", "Truyền hình ảnh qua mạng thông tin sử dụng bộ giao thức TCP/IP", "Truyền giọng nói và hình ảnh qua mạng thông tin sử dụng bộ giao thức TCP/IP", "Truyền giọng nói qua mạng điện thoại"], 1],

["101. Dịch vụ mạng xã hội (social networking service) là dịch vụ?", ["Liên kết các thành viên trong xã hội", "Liên kết các thành viên trong mạng LAN", "Liên kết các thành viên trong mạng WAN", "Liên kết các thành viên cùng sở thích trên Internet lại với nhau với nhiều mục đích khác nhau không phân biệt không gian và thời gian. Những người tham gia vào dịch vụ mạng xã hội còn được gọi là cư dân mạng."], 4],
["102. Cáp quang học (fiber optic) là loại phương tiện truyền dẫn vật lý được sử dụng nhiều nhất hiện nay, chúng có các đặc điểm?", ["Dùng tín hiệu là ánh sáng nên đạt được tốc độ truyền tối đa và kéo cáp càng thẳng càng tốt không được bẻ góc hẹp (gấp). Chi phí cao hơn hắn các loại cáp khác", "Tín hiệu là ánh sáng nên rất khó nhiều tín hiệu hoặc nghe trộm", "Không cần nguồn phát có công suất cao, thích hợp truyền tín hiệu dạng số nên đặc biệt thích hợp khi dùng cho mạng máy tính", "Cả A,B,C đều đúng"], 4],
["103. Băng thông (bandwidth) là một khái niệm rộng mà tùy theo góc độ đề cập đến, nó có nghĩa khác nhau. Phát biểu nào là đúng khi nói về băng thông sau đây?", ["Thuật ngữ này dùng để chỉ lưu lượng của tín hiệu điện hoặc số lượng dữ liệu được truyền qua thiết bị truyền dẫn trên một đơn vị thời gian (giây).", "Với một website, thuật ngữ “băng thông” thường được sử dụng để mô tả số lượng dữ liệu tối đa, mà bạn được phép trao đổi (bao gồm upload và download) theo tháng. Vậy, nếu băng thông lớn thì cùng một lúc có nhiều người có thể truy cập vào web site của bạn được. Nếu băng thông hẹp (băng thông nhỏ) người truy cập sẽ phải nhường nhau để truy cập.", "Bandwidth (the width of a band of electromagnetic frequencies : tạm dịch là độ rộng của một dải tần số điện từ), đại diện cho tốc độ truyền dữ liệu của một đường truyền, hay là độ rộng (width) của một dải tần số mà các tín hiệu điện tử chiếm giữ trên một phương tiện truyền dẫn.", "Cả A,B,C đều đúng"], 4],
["104. Phát biểu nào là sai về các dịch vụ internet?", ["E-commerce : Thương mại điện tử là một loạt các hoạt động kinh doanh, thanh toán trực tuyến đối với các sản phẩm và dịch vụ thông qua Internet.", "E-learning : Phương thức học tập có sử dụng kết nối mạng để phục vụ học tập, lấy tài liệu học, trao đổi giao tiếp giữa người học với nhau và với giảng viên.", "E-government : Chính phủ Điện tử là ứng dụng công nghệ thông tin và truyền thông (ICT) trong quản lý và điều hành của cơ quan của Chính quyền, tạo môi trường làm việc có hiệu lực, hiệu quả và minh bạch hơn; cung cấp thông tin, dịch vụ tốt hơn, nhanh hơn cho người dân, doanh nghiệp và các tổ chức.", "E-mail : Dịch vụ thư điện tử, với ưu điểm nhanh chóng, không bị thất lạc thư và có thể sử dụng mọi lúc mọi nơi mà không cần kết nối mạng."], 4],
["105. Khi bạn có nhu cầu xây dựng ứng dụng bán hàng trực tuyến (online shop) là thuộc loại dịch vụ Internet nào:", ["e-banking", "e-government", "e-learning", "e-commerce"], 4],
["106. Khái niệm Cổng Thông Tin hay Cổng Thông Tin Điện Tử (Portal) là?", ["Cổng kết nối thiết bị phần cứng", "Cổng ra/vào thông tin điện tử trên máy tính", "Một hoặc một nhóm trang web mà từ đó người truy cập có thể dễ dàng truy xuất các trang web và các dịch vụ thông tin khác trên mạng máy tính. Được xem là điểm xuất phát cho hành trình \"duyệt web\". Lợi ích lớn nhất mà cổng thông tin điện tử đem lại là tính tiện lợi, dễ sử dụng và dễ thay đổi, tùy chỉnh cho phù hợp với nhu cầu của từng cá nhân.", "Là nguồn gốc của mạng máy tính"], 3],
["107. Điện toán đám mây (tiếng Anh: cloud computing) là khái niệm?", ["Là khái niệm tổng thể bao gồm cả các khái niệm như phần mềm dịch vụ, Web 2.0 và các vấn đề khác xuất hiện gần đây, các xu hướng công nghệ nổi bật được triển khai sử dụng trên internet. Thuật ngữ \"đám mây\" ở đây là lối nói ẩn dụ chỉ mạng Internet", "Các yêu cầu liên quan đến CNTT được cung cấp dưới dạng các \"dịch vụ\", cho phép người sử dụng truy cập các dịch vụ công nghệ từ một nhà cung cấp nào đó \"trong đám mây\" mà không cần phải có các kiến thức, kinh nghiệm về công nghệ đó.", "Người dùng không cần quan tâm đến các cơ sở hạ tầng phục vụ công nghệ đó., trong đó chủ yếu là vấn đề dựa vào Internet để đáp ứng những nhu cầu điện toán của người dùng.", "Cả A,B,C đúng"], 4],
["108. Cách đặt vị trí màn hình máy tính nào là chính xác nhất?", ["Tránh nguồn sáng trực tiếp chiếu vào màn hình.", "Vị trí nào cũng được và điều chỉnh độ sáng màn hình về mức sáng nhất", "Đặt cao hơn tầm mắt giúp tránh hiện tượng mỏi mắt", "Đặt gần lại để mắt bớt điều tiết"], 1],

["112. Phát biểu nào đúng khi tư thế làm việc với máy tính được đề nghị như hình?", ["Góc nhìn 15° – 20° với tầm nhìn 350-600 mm đối với các văn bản có cỡ phông chữ thường.", "Tựa lưng, chiều cao ghế, chiều cao bàn điều chỉnh được, nơi để chân chắc chắn, thoải mái, có chỗ để cổ tay nếu cần thiết, ghế có mép tròn uốn cong", "Điều chỉnh độ sáng trong môi trường đang làm việc bằng rèm cửa, chao đèn ... giảm thiểu hiện tượng mỏi mắt.", "Cả A,B,C đều đúng"], 4],

["120. Chế độ Hibernate : ngủ đông trên máy tính là chế độ?", ["Là chế độ tắt máy tính hoàn toàn", "Chế độ lưu hiện trạng máy vào RAM và duy trì điện cấp cho RAM khi phần còn lại của hệ thống được tắt hoàn toàn", "Lưu hiện trạng của máy vào ổ cứng, sau đó tắt hoàn toàn máy tính. Trong lần khởi động sau, HDD sẽ lấy dữ liệu từ ổ cứng chuyển sang RAM, đưa máy tính trở lại trạng thái y hệt trước đó", "Chế độ tắt hoàn toàn máy tính chỉ còn duy trì hoạt động của CPU"], 3],

["122. Khi có máy tính mới, bạn sẽ làm gì với chiếc máy tính cũ đang dùng?", ["Đem vứt ra thùng rác", "Đem cất vào kho đồ cũ", "Đây là rác thải độc hại, phải đem đến cơ sở xử lý và trả tiền để phân loại xử lý đúng cách", "Có nhiều lựa chọn tốt đẹp : đem tặng, dụng cụ học tập phần cứng, mạng máy tính, dùng chạy các ứng dụng không đòi hỏi tốc độ, làm tường lửa, làm kho chứa dữ liệu gia đình ..."], 4],
["123. Quản lý cáp điện như thế nào để đảm bảo an toàn cho người sử dụng?", ["Đảm bảo dây cáp đặt ở nơi an toàn để tránh bị ngã do vướng dây", "Nên sử dụng vỏ bọc dây cáp và ghim xuống sàn ở những chỗ cáp qua đường đi", "Sử dụng các thiết bị đúng tiêu chuẩn có chất lượng tốt, đảm bảo tiếp xúc tốt", "Cả A,B,C đều đúng"], 4],
["124. Khái niệm dữ liệu máy tính được hiểu như thế nào?", ["Dữ liệu là các số, ký tự, hình ảnh hay các kết quả khác của các thiết bị chuyển đổi các lượng vật lý thành các ký hiệu được đưa vào máy tính", "Dữ liệu bao gồm những mệnh đề phản ánh thực tại. Một phân loại lớn của các mệnh đề quan trọng trong thực tiễn là các đo đặc hay quan sát về một đại lượng biến đổi", "Một chương trình máy tính là một tập hợp dữ liệu được hiểu là các lệnh. Hầu hết các ngôn ngữ máy tính phân biệt giữa dữ liệu chương trình và các dữ liệu khác mà chương trình đó làm việc", "Cả A,B,C đều đúng"], 4],
["125. Luật sở hữu trí tuệ tại Việt Nam có hiệu lực từ năm nào:", ["2000", "2004", "2006", "2008"], 2],
["126. Trong quy định pháp luật Việt Nam về việc bảo vệ thông tin cá nhân, đâu là nguyên tắc bảo vệ thông tin cá nhân trên mạng được nêu rõ?", ["Cá nhân tự bảo vệ thông tin cá nhân của mình và tuân thủ quy định của pháp luật và quy định khác của pháp luật có liên quan về cung cấp thông tin cá nhân khi sử dụng dịch vụ trên mạng", "Cơ quan, tổ chức, cá nhân xử lý thông tin cá nhân có trách nhiệm bảo đảm an toàn thông tin mạng đối với thông tin do mình xử lý", "Tổ chức, cá nhân xử lý thông tin cá nhân phải xây dựng và công bố công khai biện pháp xử lý, bảo vệ thông tin cá nhân của tổ chức, cá nhân mình. Việc xử lý thông tin cá nhân phục vụ mục đích bảo đảm quốc phòng, an ninh, trật tự, an toàn xã hội hoặc không nhằm mục đích thương mại được thực hiện theo quy định khác của pháp luật có liên quan.", "Cả A,B,C đều đúng"], 4],
["127. Theo khoản 21 điều 3 nghị định 72/2013 về khái niệm trang thông tin điện tử thì đó là?", ["Một hệ thống thông tin được sử dụng để tạo ra một hoặc nhiều trang có thông tin được trình bày dưới các chữ viết, chữ số, hình ảnh, âm thanh hay đặc biệt hơn là các ký hiệu để phục vụ cho việc cung cấp thông tin trên internet", "Báo mạng điện tử, trang tin tổng hợp, trang tin chuyên ngành", "Trang tin nội bộ, trang tin cá nhân", "Cả A,B,C đều đúng"], 1],
["128. Pháp luật Việt Nam qui định về trách nhiệm của tổ chức, cá nhân xử lý thông tin cá nhân là?", ["Tiến hành thu thập thông tin cá nhân sau khi có sự đồng ý của chủ thể thông tin cá nhân về phạm vi, mục đích cụ thể của việc thu thập và sử dụng thông tin đó", "Chỉ sử dụng thông tin cá nhân đã thu thập vào mục đích khác mục đích ban đầu sau khi có sự đồng ý của chủ thể thông tin cá nhân", "Không được cung cấp, chia sẻ, phát tán thông tin cá nhân mà mình đã thu thập, tiếp cận, kiểm soát cho bên thứ ba, trừ trường hợp có sự đồng ý của chủ thể thông tin cá nhân đó hoặc theo yêu cầu của cơ quan nhà nước có thẩm quyền", "Cả A,B,C đều đúng"], 4],
["129. Thông tin nào được nêu trong Hội nghị Bảo vệ Dữ liệu Quốc tế 2005 tại Montreux”:", ["11 Nguyên tắc : hợp pháp trong lúc thu thập và xử lý dữ liệu. Đúng đắn. Phù hợp với mục đích. Cân xứng. Minh bạch. Được cung quyết định cho từng cá nhân và bảo đảm quyền truy cập cho người có liên quan. Không phân biệt đối xử. An toàn. Trách nhiệm trước pháp lý. Giám sát độc lập và hình phạt theo pháp luật. Mức độ bảo vệ tương ứng trong vận chuyển dữ liệu xuyên biên giới", "Ý kiến phản biện về bảo vệ dữ liệu quá mức hay bảo vệ dữ liệu không đúng chỗ có thể gây thiệt hại cho cá nhân, tổ chức có quyền truy cập dữ liệu", "Những dữ liệu về điều trị trong y học hay dữ liệu về tội phạm cần có các nguyên tắc bảo vệ riêng nhằm đảo bảo nguyên tắc thu nhập thông tin", "Cả A,B,C đều đúng"], 1],
["130. Chúng ta phải ý thức như thế nào để bảo vệ bản quyền phần mềm?", ["Tôn trọng luật bản quyền phần mềm", "Hay tận dụng sử dụng những phần mềm miễn phí hoặc phần mềm nguồn mở", "Dùng phần mềm crack để nhiễm virus gây hỏng máy, mất dữ liệu", "Cả A,B,C đều đúng"], 1],
["131. Thế nào là hành vi vi phạm bản quyền phần mềm?", ["Sao chép và sử dụng phần mềm không có giấy phép", "Lưu truyền phần mềm không xin phép (trái phép) dù có ghi rõ nguồn, trích dẫn hoặc không ghi rõ nguồn và tên tác giả chính thức", "Các hành vi có thể gây hiểu lầm là các công trình đó là của mình sáng tạo ra", "Cả A,B,C đều đúng"], 4],
["132. Mục đích chủ yếu của chính sách an toàn thông tin của một tổ chức là gì?", ["Theo dõi sát hoạt động kinh doanh", "Theo dõi thị trường", "Theo dõi và kiểm soát thông tin, dữ liệu nhạy cảm", "Quản lý thông tin nhân sự công ty"], 3],
["133. Công dân Việt Nam khi tham gia mạng xã hội, các thành viên sẽ có quyền?", ["Trình bày ý kiến cá nhân tùy thích", "Đăng tải nội dung âm thanh, hình ảnh tùy thích", "Không được phép làm gì.", "Được phép làm tất cả miễn không vi phạm luật pháp nước CHXHCN Việt Nam, không vi phạm thuần phong mỹ tục Việt Nam và các qui định riêng của mạng xã hội đang tham gia"], 4],
["134. Khi tham gia vào mạng, mạng xã hội người dùng sẽ?", ["Bị khóa hay xóa tài khoản khi vi phạm, khi đó người dùng sẽ tạo tài khoản mới rồi tiếp tục vi phạm vì chẳng thể tìm ra ai là chủ tài khoản trên internet.", "Không dùng tài khoản đó nữa, không tham gia mạng xã hội", "Tham gia vào một mạng, mạng xã hội khác", "Tôn trọng pháp luật nhà nước, vì mọi hành vi sai trái đều tìm ra thủ phạm để xử lý, thậm chí, tùy theo mức độ có thể bị xử lý hình sự"], 4],
["135. Đâu là giải pháp sao lưu dữ liệu dự phòng?", ["Sao lưu đầy đủ : Dùng sao lưu tất cả, tốn kém về thời gian và phương tiện sao lưu. Sao lưu đầy đủ chỉ thực hiện được khi ngừng toàn bộ hoạt động của hệ thống", "Sao lưu gia tăng : Dùng để sao lưu tất cả các thông tin được chọn mà có sự thay đổi hoặc cập nhật so với lần sao lưu gần nhất trước đó. Phương thức này cho phép tiết kiệm tối đa thời gian, đồng thời cho phép thực hiện sao lưu trực tuyến trong khi hệ thống vẫn đang hoạt động, tuy nhiên khá phức tạp và sẽ tốn nhiều dung lượng lưu trữ trong trường hợp dùng cơ chế Logs của hệ thống.", "Sao lưu khác biệt : Dùng để sao lưu tất cả các thông tin được chọn mà có sự thay đổi hoặc cập nhật so với lần sao lưu khác biệt hoặc đầy đủ gần nhất trước đó.", "Cả A,B,C đều đúng"], 4],
["136. Có 2 cách để sao lưu: sao lưu cực bộ (ngoại tuyến) và sao lưu trực tuyến (mạng máy tính), nên lựa chọn phương án nào khi chúng ta có dữ liệu rất quan trọng cần sao lưu dự phòng?", ["Nâng cấp máy tính cho an toàn dữ liệu, không cần sao lưu", "Chọn lưu trữ cực bộ vì tốc độ nhanh, không gian lưu trữ lớn, kiểm soát được bản sao", "Chọn lưu trữ trực tuyến vì độ an toàn dữ liệu được bảo toàn khi xảy ra thiên tai", "Mỗi cách đều có ưu và khuyết điểm riêng, có nghĩa là chúng đều quan trọng trong những trường hợp khác nhau. Lý tưởng nhất là sử dụng kết hợp cả hai phương pháp."], 4],
["137. An toàn dữ liệu có thể hiểu là:", ["Dễ dàng cho việc bảo trì dữ liệu", "Ngăn chặn các truy nhập trái phép, sai quy định từ trong ra hay từ ngoài vào", "Thống nhất các tiêu chuẩn, thủ tục và các biện pháp bảo vệ, an toàn dữ liệu", "Tính nhất quán và toàn vẹn dữ liệu"], 2],
["138. Chọn phương án tốt nhất trong các lựa chọn sau cho dữ liệu của bạn được an toàn hơn?", ["Khóa máy tính khi không làm việc", "Cất giấu an toàn các phương tiện lưu trữ và sao lưu dự phòng", "Khóa máy tính khi ra khỏi nơi làm việc, khóa các phương tiện lưu trữ, phương tiện sao lưu dự phòng, hạn chế chế độ đăng nhập tự động các tài khoản trên máy", "Chỉ cần dùng tường lửa là an toàn dữ liệu"], 3],
["139. Malware (từ ghép của malicious và software) là phần mềm độc hại, nó là?", ["Một loại phần mềm hệ thống do các tin tặc hay những người thích đùa tạo ra nhằm gây hại cho các máy tính", "Nó có mức độ nguy hiểm khác nhau, từ việc chỉ hiển thị các cửa sổ mạng thông điệp hù doạ tới việc tấn công chiếm quyền kiểm soát máy tính và lây lan sang các máy tính khác", "Bao gồm các loại như : virus, worm, trojan, spyware, adware, keylogger, backdoor, rootkit.", "Cả A,B,C đều đúng"], 4],
["140. Những biểu hiện nào khiến bạn nghi ngờ máy tính đã bị nhiễm virus.", ["Máy tính bạn thường xuyên bị treo hay phát sinh lỗi", "Máy tính bạn trở nên chậm khi khởi động một chương trình nào đó", "Không khởi động được hệ điều hành", "Cả A,B,C đều đúng"], 4],
["141. Virus máy tính có khả năng đặc trưng nào?", ["Tự sao chép và lây lan", "Làm cho máy tính không hoạt động.", "Làm thay đổi hoặc mất dữ liệu trên máy", "Làm hỏng phần cứng."], 1],
["142. Bạn cần làm gì khi nhận thấy có dấu hiệu lây nhiễm virus", ["Ngắt kết với mạng nội bộ (LAN) nếu có.", "Trước khi thực hiện bất cứ hành động nào, bạn nên sao lưu tất cả dữ liệu bạn bằng các thiết bị lưu trữ ngoài như CD, đĩa mềm, đĩa flash (USB Stick)...", "Cài đặt một phần mềm quét virus nếu bạn chưa có, hay tải bản cập nhật mới nhất cho phần mềm quét virus của bạn.", "Cả A,B,C đều đúng"], 4],
["143. Khi máy tính bị nhiễm Virus ta nên sao lưu dữ liệu và :", ["Định dạng đĩa cứng và cài đặt lại", "Tìm và xoá các tập tin bị nhiễm Virus", "Dùng các phần mềm phát hiện và diệt Virus", "Nâng cấp hệ điều hành mới."], 3],
["144. Đâu là cách phòng chống virus hiệu quả?", ["Cài đặt một phần mềm diệt virus, cập nhật thường xuyên và quét máy tính hàng ngày", "Quét trước thiết bị ngoại vi khi sử dụng, quét các tập định kèm khi tải về hay từ Email", "Không cài đặt phần mềm lạ không rõ nguồn gốc, hỏi những chuyên gia khi phát hiện những thay đổi lạ khi đang dùng máy tính", "Cả A,B,C đều đúng"], 4],
["145. Tại sao phải thường xuyên cập nhật bản vá lỗi cho hệ điều hành, phần mềm an ninh mạng, phần mềm diệt virus thường xuyên?", ["Phần mềm độc hại cũng phát triển liên tục vì vậy, việc cập nhật phần mềm bảo mật cũng rất cần thiết và mang lại nhiều lợi thế, bao gồm việc bảo mật hiệu quả hơn, cải thiện hiệu suất làm việc, gia tăng tốc độ hoạt động và thêm nhiều tính năng, chức năng bảo mật tân tiến khác", "\"Hệ thống máy đang chạy tốt mà, cập nhật phần mềm làm gì?\", \"Lỡ như cái bản cập nhật này nó có lỗi hay tệ hơn cái cũ thì sao?\"", "Không đủ thời gian để làm và phải còn tìm hiểu cách dùng tính năng mới", "Không làm vì chưa bao giờ làm công việc này"], 1],
["146. Phát biểu nào là ĐÚNG về khái niệm tường lửa (firewall)?", ["Là một thiết bị phần cứng (và/hoặc) một phần mềm hoạt động trong một môi trường máy tính nối mạng để kiểm soát liên lạc bị cấm bởi chính sách an ninh của cá nhân hay tổ chức", "Là rào chắn mà một số cá nhân, tổ chức, doanh nghiệp, cơ quan nhà nước lập ra nhằm ngăn chặn các truy cập thông tin không mong muốn từ ngoài vào hệ thống mạng nội bộ cũng như ngăn chặn các thông tin bảo mật nằm trong mạng nội bộ xuất ra ngoài internet mà không được cho phép", "Cấu hình (cài đặt chính sách) đúng đắn cho các tường lửa đòi hỏi kỹ năng của người quản trị hệ thống. Việc này yêu cầu hiểu biết đáng kể về các giao thức mạng và về an ninh máy tính. Nhưng lối nhò có thể biến tường lửa thành một công cụ an ninh vô dụng", "Cả A,B,C đều đúng"], 4],
["147. Phát biểu nào là SAI về khái niệm và chức năng tường lửa (firewall)?", ["Sử dụng tường lửa cần phải xử lý một lượng lớn thông tin nên việc xử lý lọc thông tin có thể làm chậm quá trình kết nối của người kết nối", "Tường lửa là không thể vượt qua", "Người ta xây dựng chính sách an ninh dựa trên từ khóa, cổng, tên miền ...", "Cơ quan nhà nước có thể lập bức tường lửa ngay từ cổng Internet quốc gia hoặc yêu cầu các nhà cung cấp dịch vụ đường truyền (IXP) và nhà cung cấp dịch vụ Internet (ISP) thiết lập hệ thống tường lửa hữu hiệu hoặc yêu cầu các đại lý kinh doanh internet thực hiện các biện pháp khác"], 2],
["148. Mật khẩu hiện đang là phương pháp phổ biến nhất trong việc bảo vệ tài khoản cá nhân, cách nào sau đây sẽ cho chúng ta một mật khẩu được coi là “mạnh”?", ["Mật khẩu nên có chiều dài từ 8 ký tự trở lên và càng dài càng tốt", "Mật khẩu nên chứa cả chữ viết thường và chữ VIỆT HOA", "Mật khẩu nên chứa cả chữ số và ký tự đặc biệt : 4,23@,#...", "Cả A,B,C đều đúng"], 4],
["149. Khái niệm “Giao dịch trực tuyến là gì”?", ["Người dùng sẽ thông qua hệ thống mạng internet để thực hiện giao dịch của mình mà không phải đến trụ sở của nơi giao dịch. Một hoạt động giao dịch và thanh toán sẽ được thực hiện tự động khi người mua nhập lệnh vào hệ thống và người mua phải trả một khoản phí cho nhà môi giới hoặc nhà cung cấp hệ thống", "Người dùng trực tiếp giao dịch với nơi cung cấp sản phẩm, dịch vụ không cần internet", "Phương thức giao dịch truyền thống ngày nay gọi là giao dịch trực tuyến", "Sứ kết hợp của giao dịch truyền thống và mạng internet"], 1],

["740. Dịch vụ nào sau đây là dịch vụ của ngân hàng điện tử cơ bản?", ["Tra cứu số dư và giao dịch trên tài khoản", "Tất cả các ý nêu ra", "Thanh toán hóa đơn cho thẻ tín dụng, hóa đơn điện, nước, điện thoại, Internet...", "Chuyển khoản trong nước và quốc tế"], 2],
["741. Nhắn tin tức thời (IM) là?", ["Hệ thống tin nhắn máy tính", "Nhận và gửi ở dạng văn bản chứ không phải giọng nói", "Không lưu trữ và chờ đợi như e-mail", "Cả A,B,C đều đúng"], 4],
["742. Đề xuất nào không phải là lợi ích chủ yếu của việc nhắn tin tức thời (IM)?", ["Truyền thông thời gian thực", "Biết có hay không người liên hệ đang trực tuyến", "Chi phí thấp và truyền tải được tập tin", "Không cần sóng điện thoại"], 4],
["743. Đặc trưng nào không phải là đặc trưng của mạng xã hội (social network)?", ["Do chính phủ quản lý", "Có sự tham gia trực tiếp của nhiều cá nhân", "Là website mở với nội dung được xây dựng bởi các thành viên tham gia", "Kết nối các thành viên cùng sở thích"], 1]

};
    // ===== STATE =====
    let isFinished = false; // Mặc định là false khi bắt đầu
    let isExam = false, timerInterval = null, timeLeft = 1800; // 30 phút
    let userAnswers = []; // Lưu đáp án người dùng chọn
    let reviewCorrect = 0; // BIẾN MỚI: Lưu số câu đúng khi ôn tập
    let selectedChaps = [];
    let qs = [], cur = 0, correct = 0, total = 0, wrong = [], review = false;

    const app = document.getElementById("app");

    // ===== START UI =====
    function startUI() {
      app.innerHTML = `
    <h2>Bắt đầu</h2>
    <div class="chaps">
<div class="chap" id="c1" onclick="toggleChap('c1', this)">Chương 1</div>
      </div> <div class="slider-wrap">
        <div id="val">10</div>
      <input type="range" id="slider" min="1" max="160" value="10">
        </div> <button onclick="start()">Bắt đầu</button>
  `;
      updateSlider();
    }

    // ===== TOGGLE CHAPTER =====
    function toggleChap(key, el) {
      if (selectedChaps.includes(key)) {
        selectedChaps = selectedChaps.filter(c => c !== key);
        el.classList.remove("active");
      } else {
        selectedChaps.push(key);
        el.classList.add("active");
      }

      updateSlider();
    }

    // ===== UPDATE SLIDER =====
    function updateSlider() {
      const slider = document.getElementById("slider");
      const val = document.getElementById("val");

      if (!slider) return;

      let totalQ = 0;
      selectedChaps.forEach(c => totalQ += qBank[c].length);

      let minQ = selectedChaps.length || 1;

      slider.min = minQ;
      slider.max = totalQ || 1;

      // SỬA LỖI: Ép kiểu sang Số (Number) trước khi so sánh
      if (Number(slider.value) < minQ) {
        slider.value = minQ;
      } else if (Number(slider.value) > totalQ) {
        slider.value = totalQ;
      }

      move();
      slider.oninput = move;

      function move() {
        // SỬA LỖI: Ép kiểu sang Số (Number) trước khi so sánh
        if (Number(slider.value) < Number(slider.min)) {
          slider.value = slider.min;
        }

        const percent = (slider.value - slider.min) / (slider.max - slider.min || 1);

        val.innerText = slider.value;

        const w = slider.offsetWidth;
        const thumb = 24; // Đã chỉnh lại 24px cho khớp với giao diện CSS mới
        const x = percent * (w - thumb) + thumb / 2;

        val.style.left = x + "px";

        // Cập nhật lại màu sắc thanh gạt khớp với giao diện xanh hiện đại
        slider.style.background =
          `linear-gradient(to right,#3b82f6 ${percent * 100}%,#e2e8f0 ${percent * 100}%)`;
      }
    }

    // ===== START =====
    function start() {
      if (selectedChaps.length === 0) {
        alert("Phải chọn ít nhất 1 chương");
        return;
      }
      const num = +document.getElementById("slider").value;
      let pool = [];
      selectedChaps.forEach(c => { pool = pool.concat(qBank[c]); });

      qs = shuffle(pool).slice(0, num);

      // ĐẢM BẢO RESET CÁC BIẾN NÀY
      cur = 0;
      correct = 0;
      wrong = [];
      review = false;
      total = qs.length;

      showQ();
    }

    // ===== SHOW =====
    // Thêm biến trạng thái đóng mở Nav
    let isNavOpen = false;

    function toggleNav() {
      isNavOpen = !isNavOpen;
      showQ(); // Vẽ lại giao diện với trạng thái Nav mới
    }

    function showQ() {
      if (cur >= qs.length && !isExam) { nextPhase(); return; }

      const [q, opts, ansRaw] = qs[cur];
      const hoverableQuestion = q.split(' ').map(word => `<span class="hover-word">${word}</span>`).join(' ');

      const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      const timeStr = `${mins}:${secs}`;

      let navButtonsHTML = "";
      if (isExam || isFinished) {
        navButtonsHTML = `
        <div class="nav-btns-fixed">
          <button onclick="prevQ()" ${cur === 0 ? 'disabled' : ''}>Lùi (W)</button>
          ${!isFinished && cur === qs.length - 1
            ? `<button onclick="finishExam()" style="background:#10b981">Nộp bài</button>`
            : `<button onclick="nextQ()" ${cur === qs.length - 1 ? 'disabled' : ''}>Tiến (E)</button>`}
        </div>`;
      }

      let timerValue = isFinished ? `Kết quả: ${correct} / ${qs.length}` : timeStr;
      let timerHTML = (isExam || isFinished) ? `<div id="timer">${timerValue}</div>` : "";

      let mainContent = `
    ${timerHTML}
    ${(isExam || isFinished) ? `<div class="toggle-nav-btn" onclick="toggleNav()">${isNavOpen ? '✕ Đóng danh sách (Q)' : '☰ Chọn câu hỏi (Q)'}</div>` : ""}
    <div class="progress-text">Câu ${cur + 1} / ${qs.length}</div>
    <div class="q">${hoverableQuestion}</div>
    <div id="ans"></div>
  `;

      app.innerHTML = `
    <div class="quiz-wrapper" style="position: relative;">
      <button class="exit-btn" onclick="exitQuiz()" title="Thoát">
        <svg viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>

      ${(isExam || isFinished) ? `
        <div class="nav-panel ${isNavOpen ? '' : 'collapsed'}">
          <div style="grid-column: span 5; text-align: center; margin-bottom: 10px; font-size: 12px; color: #60a5fa; font-weight: bold;">
            DANH SÁCH CÂU HỎI (Q)
          </div>
          ${renderNavItems(isFinished)}
        </div>` : ""}
      
      <div class="quiz-main-content">${mainContent}</div>
      ${navButtonsHTML}
    </div>
  `;

      // Render Options (giữ nguyên logic cũ của bạn)
      const box = document.getElementById("ans");
      const letters = ["A", "B", "C", "D"];
      opts.forEach((t, i) => {
        const d = document.createElement("div");
        d.className = "option";
        if (isFinished) {
          if (i + 1 === ansRaw) d.classList.add("correct");
          if (userAnswers[cur] === i + 1 && i + 1 !== ansRaw) d.classList.add("wrong");
        } else if (isExam && userAnswers[cur] === i + 1) {
          d.classList.add("selected");
        }
        d.innerText = `${letters[i]}. ${t}`;
        d.onclick = () => {
          if (isFinished) return;
          userAnswers[cur] = i + 1;
          if (!isExam) {
            if (i + 1 === ansRaw) { d.classList.add("correct"); correct++; }
            else { d.classList.add("wrong"); wrong.push(qs[cur]); }
            document.querySelectorAll(".option").forEach(el => el.style.pointerEvents = "none");
            setTimeout(() => { cur++; showQ(); }, 600);
          } else { showQ(); }
        };
        box.appendChild(d);
      });
    }
    function exitQuiz() {
      const msg = isFinished ? "Bạn muốn quay về màn hình chính?" : "Tiến trình làm bài sẽ bị mất. Bạn chắc chắn muốn thoát?";
      if (confirm(msg)) {
        // Dừng đồng hồ
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        // Reset toàn bộ biến trạng thái
        isExam = false;
        isFinished = false;
        isNavOpen = false;
        cur = 0;
        correct = 0;
        userAnswers = [];
        wrong = [];
        review = false;

        // Quay lại StartUI
        startUI();
      }
    }
    // Hàm bổ trợ đóng/mở Layer Nav mượt mà
    function toggleNav() {
      isNavOpen = !isNavOpen;
      showQ();
    }

    // Hàm render danh sách câu hỏi (Thanh Nav)
    function renderNavItems(finished) {
      return qs.map((q, i) => {
        let statusClass = ""; // Mặc định là nav-item (màu xám)

        if (finished) {
          statusClass = (userAnswers[i] === q[2]) ? 'correct' : 'wrong';
        } else if (userAnswers[i] !== null) {
          statusClass = 'done'; // Xanh nước biển
        }

        return `<div class="nav-item ${statusClass} ${cur === i ? 'active' : ''}" 
                 onclick="cur=${i}; isNavOpen=false; showQ();">${i + 1}</div>`;
        // Thêm isNavOpen=false để tự đóng layer sau khi chọn câu
      }).join('');
    }
    function selectAnswer(ansIdx) {
      userAnswers[cur] = ansIdx;
    }

    function nextQ() { if (cur < qs.length - 1) { cur++; showQ(); } }
    function prevQ() { if (cur > 0) { cur--; showQ(); } }

    function finishExam() {
      if (!confirm("Xác nhận nộp bài?")) return;
      clearInterval(timerInterval);
      timerInterval = null;
      window.isFinished = true; // Sử dụng biến toàn cục để showQ nhận diện

      correct = 0;
      qs.forEach((q, i) => { if (userAnswers[i] === q[2]) correct++; });
      cur = 0;
      showQ();
    }


    function check(o, el, raw) {
      if (o.ok) {
        el.classList.add("correct");
        if (!review) {
          correct++; // Điểm lần 1
        } else {
          reviewCorrect++; // Điểm khi ôn tập
        }
      } else {
        el.classList.add("wrong");
        if (!review) wrong.push(raw);
      }

      document.querySelectorAll(".option")
        .forEach(e => e.style.pointerEvents = "none");

      setTimeout(() => { cur++; showQ(); }, 600);
    }
    // ===== NEXT =====
    function nextPhase() {
      if (wrong.length > 0 && !review) {
        qs = [...wrong]; // Lấy danh sách câu sai làm bộ câu hỏi mới
        wrong = [];      // Reset danh sách sai tạm thời
        cur = 0;         // Reset số thứ tự câu về 0 để làm lại từ đầu danh sách sai
        review = true;   // Bật chế độ ôn tập (vòng này không tính điểm nữa)

        app.innerHTML = `
      <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; margin-top: 60px; animation: fadeIn 0.5s ease;">
        <div style="font-size: 50px; margin-bottom: 10px;">🔄</div>
        <h2 style="color: #f59e0b; font-size: 26px; font-weight: 800;">Ôn tập lại!</h2>
        <p style="font-size: 18px; color: #475569; margin-top: 10px; line-height: 1.6; font-weight: 600;">
          Bạn có <strong style="color: #ef4444; font-size: 20px;">${qs.length}</strong> câu chưa chính xác.<br>
          Hãy cùng làm lại các câu này nhé...
        </p>
      </div>
    `;

        setTimeout(() => {
          showQ();
        }, 3000);

      } else {
        result(); // Nếu không có câu sai hoặc đã xong vòng review thì hiện kết quả
      }
    }

    // ===== RESULT =====
    function result() {
      let reviewText = "";
      if (review && (reviewCorrect > 0 || total > correct)) {
        reviewText = `
      <div style="margin-top: 10px; color: #60a5fa; font-size: 18px; border-top: 1px solid #475569; pt-10px">
        ✨ Kết quả ôn tập: <b>${reviewCorrect} / ${qs.length}</b> câu đúng
      </div>`;
      }

      app.innerHTML = `
    <div style="text-align: center; padding: 10px;">
      <h2 style="font-size: 28px; margin-bottom: 20px;">🎉 Hoàn thành!</h2>
      <div style="background: #334155; padding: 25px; border-radius: 20px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.3)">
        <p style="font-size: 20px; margin: 0; color: #94a3b8;">Điểm lần đầu của bạn:</p>
        <p style="font-size: 48px; font-weight: 800; margin: 10px 0; color: #fbbf24;">${correct} <span style="font-size: 24px; color: #64748b;">/ ${total}</span></p>
        ${reviewText}
      </div>
      <button onclick="reset()" style="margin-top: 30px;">Làm bài mới</button>
    </div>
  `;
    }
    // ===== RESET =====
    function reset() {
      selectedChaps = [];
      startUI();
    }

    // ===== UTIL =====
    function shuffle(a) {
      return a.sort(() => Math.random() - 0.5);
    }

    // INIT
    startUI();
    // =========================================
    // BỔ SUNG 1: TÍNH NĂNG NHẬN DIỆN MÁY TÍNH
    // =========================================
    function detectDesktop() {
      // Dùng Regex kiểm tra User-Agent xem có phải mobile/tablet không
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // Nếu không phải Mobile VÀ chiều rộng màn hình > 768px -> Đích thị là máy tính
      if (!isMobile && window.innerWidth > 768) {
        document.body.classList.add('is-desktop'); // Gắn class kích hoạt CSS Desktop
      } else {
        document.body.classList.remove('is-desktop');
      }
    }

    // Chạy hàm kiểm tra ngay khi load và mỗi khi người dùng co giãn cửa sổ trình duyệt
    window.addEventListener('resize', detectDesktop);
    detectDesktop();

    // =========================================
    // BỔ SUNG 2: CHỌN ĐÁP ÁN BẰNG PHÍM (1, 2, 3, 4)
    // =========================================
    document.addEventListener('keydown', function (event) {
      // Chỉ lấy các thẻ đáp án đang hiện trên màn hình
      const options = document.querySelectorAll('.option');

      // Kiểm tra xem người dùng đã chọn đáp án chưa (tránh tình trạng bấm phím 2 lần hoặc bấm khi app đang tự động chuyển câu)
      const isAnswered = document.querySelector('.option.correct') || document.querySelector('.option.wrong');

      // Nếu đang ở màn hình có đúng 4 đáp án và chưa trả lời
      if (options.length === 4 && !isAnswered) {
        switch (event.key) {
          case '1': // Tương ứng phím 1 -> A
            options[0].click();
            break;
          case '2': // Tương ứng phím 2 -> B
            options[1].click();
            break;
          case '3': // Tương ứng phím 3 -> C
            options[2].click();
            break;
          case '4': // Tương ứng phím 4 -> D
            options[3].click();
            break;
        }
      }

      // Mở rộng thêm: Bấm Enter để bắt đầu làm bài hoặc làm lại
      if (event.key === 'Enter') {
        const btn = document.querySelector('button');
        if (btn && btn.innerText.includes('Bắt đầu') || btn && btn.innerText.includes('Làm lại')) {
          btn.click();
        }
      }
    });
    // Chế độ Ngẫu nhiên
    function startRandom() {
      selectedChaps = ['c1', 'c2', 'c3'];
      const totalAvailable = qBank.c1.length + qBank.c2.length + qBank.c3.length;
      //random num từ 5 đến 160 ( bội số của 5)
      const num = (Math.floor(Math.random() * 32) + 1) * 5;
      setupQuiz(num, false);
    }

    // Chế độ Thi thử
    function startExam() {
      isFinished = false;
      selectedChaps = ['c1', 'c2', 'c3'];
      isExam = true;
      timeLeft = 1800;
      setupQuiz(50, true);
      startTimer();
    }

    function setupQuiz(num, examMode) {
      let pool = [...qBank.c1, ...qBank.c2, ...qBank.c3];
      qs = shuffle(pool).slice(0, num);
      cur = 0; correct = 0; wrong = []; review = false;
      userAnswers = new Array(qs.length).fill(null);
      total = qs.length;
      showQ();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        // Cập nhật trực tiếp vào ID timer nếu nó tồn tại trên màn hình
        const timerEl = document.getElementById("timer");
        if (timerEl) {
          timerEl.innerText = timeStr;
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("Hết giờ làm bài!");
          finishExam();
        }
      }, 1000);
    }
    function finishExam() {
      // Kiểm tra chưa làm hết... (giữ nguyên logic cũ của bạn)
      if (userAnswers.includes(null)) {
        alert("Chưa làm hết bài!");
        return;
      }
      if (!confirm("Xác nhận nộp bài?")) return;
      clearInterval(timerInterval);
      timerInterval = null;
      isFinished = true; // CHUYỂN TRẠNG THÁI TẠI ĐÂY

      // Tính điểm
      correct = 0;
      qs.forEach((q, i) => { if (userAnswers[i] === q[2]) correct++; });

      cur = 0; // Quay lại câu 1 để xem lại
      showQ();
    }
    // Lắng nghe sự kiện người dùng định đóng hoặc làm mới trang
    window.addEventListener('beforeunload', function (e) {
      // Chỉ kích hoạt cảnh báo nếu đang ở chế độ thi (isExam) và chưa nộp bài (!isFinished)
      if (1) {
        // Thông báo tiêu chuẩn của trình duyệt (đa số trình duyệt hiện đại sẽ dùng thông báo mặc định riêng)
        const confirmationMessage = 'Ai biết à????';

        e.returnValue = confirmationMessage; // Quy định của một số trình duyệt cũ
        return confirmationMessage; // Quy định của trình duyệt hiện đại
      }
    });
  </script>
