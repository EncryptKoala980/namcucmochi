<!DOCTYPE html>
<html lang="vi">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Quiz App - Loop Mode</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #1e293b;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .is-desktop .card {
      max-width: 900px;
      min-height: 85vh;
      border-radius: 20px;
      padding: 40px 50px;
      border: 1px solid #334155;
    }

    h2 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
      color: #f8fafc;
      font-weight: 700;
    }

    .chaps {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .chap {
      flex: 1;
      text-align: center;
      padding: 16px 0;
      background: #334155;
      color: #94a3b8;
      border: 2px solid #475569;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chap.active {
      background: #1e3a8a;
      color: #60a5fa;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }

    .slider-wrap {
      position: relative;
      margin: 40px 0 20px 0;
    }

    #slider {
      width: 100%;
      height: 10px;
      border-radius: 10px;
      appearance: none;
      background: #334155;
      outline: none;
    }

    #slider::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
      transition: transform 0.1s;
    }

    #val {
      position: absolute;
      top: -36px;
      transform: translateX(-50%);
      background: #3b82f6;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
    }

    .progress-container {
      width: 100%;
      background-color: #334155;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(to right, #3b82f6, #60a5fa);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 14px;
      color: #94a3b8;
      text-align: right;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .round-indicator {
      text-align: center;
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 10px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .q {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #f8fafc;
    }

    .is-desktop .q {
      font-size: 24px;
    }

    #ans {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .is-desktop #ans {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .option {
      background: #1e293b;
      color: #cbd5e1;
      padding: 18px 20px;
      border-radius: 16px;
      font-size: 17px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid #334155;
      position: relative;
    }

    .is-desktop .option {
      padding: 22px;
      font-size: 18px;
      min-height: 90px;
    }

    @media (hover: hover) {
      .option:hover {
        transform: translateY(-2px);
        border-color: #475569;
        background: #273548;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }
    }

    .option:active {
      transform: scale(0.98);
    }

    .option.correct {
      background: #064e3b !important;
      color: #a7f3d0 !important;
      border-color: #10b981 !important;
    }

    .option.wrong {
      background: #7f1d1d !important;
      color: #fecaca !important;
      border-color: #ef4444 !important;
    }

    .is-desktop .option::after {
      content: attr(data-key);
      position: absolute;
      right: 15px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #64748b;
      font-weight: 700;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    button:hover {
      background: #2563eb;
    }

    .exit-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
      transition: 0.2s;
    }

    .exit-btn:hover {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    .exit-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quiz-main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
  </style>
</head>

    // ===== STATE QUẢN LÝ VÒNG LẶP (LOOP MODE) =====
    let currentRound = 1;       // Vòng làm hiện tại
    let roundStats = [];        // Lưu % điểm của từng vòng (dùng tính trung bình sau)
    let roundQuestions = [];    // Danh sách câu hỏi của vòng hiện tại
    let nextRoundWrong = [];    // Danh sách câu sai sẽ chuyển sang vòng sau
    let cur = 0;                // Chỉ số câu hỏi hiện tại trong vòng
    let roundCorrectCount = 0;  // Số câu trả lời đúng trong vòng hiện tại
    let selectedChaps = ["c1"];
    let totalInitialQuestions = 0;

    const app = document.getElementById("app");

    function shuffle(a) {
      return [...a].sort(() => Math.random() - 0.5);
    }

    // ===== GIAO DIỆN BẮT ĐẦU =====
    function startUI() {
  // Tự động quét các chương có trong qBank (c1, c2, c3, c4, c5...)
  let chapKeys = Object.keys(qBank);
  selectedChaps = [...chapKeys]; // Mặc định chọn tất cả các chương khi mở lên

  let chapsHTML = chapKeys.map((key, index) => {
    let chapNum = index + 1;
    let count = qBank[key].length;
    // Thêm class 'active' cho tất cả vì mặc định chọn hết
    return `<div class="chap active" id="${key}" onclick="toggleChap('${key}', this)">Chương ${chapNum} (${count} câu)</div>`;
  }).join('');

  app.innerHTML = `
    <h2>Lựa Chọn Chương Ôn Tập (Chế độ Lặp)</h2>
    <div class="chaps">
      ${chapsHTML}
    </div> 
    <div class="slider-wrap">
      <div id="val">10</div>
      <input type="range" id="slider" min="1" max="10" value="10">
    </div> 
    <button onclick="initQuizLoop()">Bắt đầu làm bài</button>
  `;
  updateSlider();
}

    function toggleChap(key, el) {
      if (selectedChaps.includes(key)) {
        if (selectedChaps.length === 1) {
          alert("Phải chọn ít nhất 1 chương!");
          return;
        }
        selectedChaps = selectedChaps.filter(c => c !== key);
        el.classList.remove("active");
      } else {
        selectedChaps.push(key);
        el.classList.add("active");
      }
      updateSlider();
    }

    function updateSlider() {
      const slider = document.getElementById("slider");
      const val = document.getElementById("val");
      if (!slider) return;

      let totalQ = 0;
      selectedChaps.forEach(c => { if (qBank[c]) totalQ += qBank[c].length; });

      slider.min = 1;
      slider.max = totalQ || 1;
      if (Number(slider.value) > totalQ) slider.value = totalQ;

      moveSliderThumb();
      slider.oninput = moveSliderThumb;

      function moveSliderThumb() {
        const percent = (slider.value - slider.min) / (slider.max - slider.min || 1);
        val.innerText = slider.value;
        const w = slider.offsetWidth;
        const x = percent * (w - 24) + 12;
        val.style.left = x + "px";
        slider.style.background = `linear-gradient(to right, #3b82f6 ${percent * 100}%, #334155 ${percent * 100}%)`;
      }
    }

    // ===== KHỞI TẠO BÀI THI LẶP =====
    function initQuizLoop() {
      if (selectedChaps.length === 0) {
        alert("Phải chọn ít nhất 1 chương!");
        return;
      }
      const num = +document.getElementById("slider").value;
      let pool = [];
      selectedChaps.forEach(c => { if (qBank[c]) pool = pool.concat(qBank[c]); });

      // Khởi tạo vòng 1
      roundQuestions = shuffle(pool).slice(0, num);
      totalInitialQuestions = roundQuestions.length;
      currentRound = 1;
      roundStats = [];
      nextRoundWrong = [];
      cur = 0;
      roundCorrectCount = 0;

      showQ();
    }

    // ===== HIỂN THỊ CÂU HỎI (KHÓA NHẢY TỰ DO) =====
    function showQ() {
      // Nếu đã hết câu hỏi trong vòng này -> Xử lý chuyển vòng
      if (cur >= roundQuestions.length) {
        finishRound();
        return;
      }

      const [q, opts, ansRaw] = roundQuestions[cur];
      const progressPercent = ((cur + 1) / roundQuestions.length) * 100;

      app.innerHTML = `
        <button class="exit-btn" onclick="exitQuiz()" title="Thoát">
          <svg viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>

        <div class="round-indicator">🔄 VÒNG LẶP THỨ: ${currentRound}</div>

        <div class="progress-container">
          <div class="progress-bar" style="width: ${progressPercent}%"></div>
        </div>
        <div class="progress-text">Câu ${cur + 1} / ${roundQuestions.length} (Vòng này)</div>

        <div class="quiz-main-content">
          <div class="q">${q}</div>
          <div id="ans"></div>
        </div>
      `;

      // Render các đáp án và cài đặt ép buộc chuyển câu ngay khi chọn
      const box = document.getElementById("ans");
      const letters = ["A", "B", "C", "D"];
      const keyCodes = ["1", "2", "3", "4"];

      opts.forEach((t, i) => {
        const d = document.createElement("div");
        d.className = "option";
        d.setAttribute("data-key", `Phím ${keyCodes[i]}`);
        d.innerText = `${letters[i]}. ${t}`;

        d.onclick = () => {
          // Khóa không cho click tiếp khi đã chọn
          document.querySelectorAll(".option").forEach(el => el.style.pointerEvents = "none");

          const selectedOption = i + 1;
          if (selectedOption === ansRaw) {
            d.classList.add("correct");
            roundCorrectCount++;
          } else {
            d.classList.add("wrong");
            // Hiển thị luôn đáp án đúng để người dùng biết
            box.children[ansRaw - 1].classList.add("correct");
            // Đưa câu sai vào danh sách lặp cho vòng sau
            nextRoundWrong.push(roundQuestions[cur]);
          }

          // Buộc chuyển sang câu tiếp theo sau 800ms
          setTimeout(() => {
            cur++;
            showQ();
          }, 800);
        };

        box.appendChild(d);
      });
    }

    // ===== KẾT THÚC MỘT VÒNG LẶP =====
    function finishRound() {
      // Tính % đúng của vòng này
      const roundScorePercent = Math.round((roundCorrectCount / roundQuestions.length) * 100);
      roundStats.push(roundScorePercent);

      // Kiểm tra xem còn câu sai nào không để tiếp tục vòng sau
      if (nextRoundWrong.length > 0) {
        let wrongCount = nextRoundWrong.length;
        
        // Thông báo chuyển sang vòng tiếp theo với các câu sai
        app.innerHTML = `
          <div style="text-align: center; padding: 20px; display: flex; flex-direction: column; justify-content: center; height: 100%;">
            <div style="font-size: 50px; margin-bottom: 10px;">🔁</div>
            <h2 style="color: #f59e0b; font-size: 24px; font-weight: 700;">Hoàn thành Vòng ${currentRound}!</h2>
            <p style="font-size: 17px; color: #94a3b8; margin: 15px 0; line-height: 1.5;">
              Bạn còn lại <strong style="color: #ef4444; font-size: 20px;">${wrongCount}</strong> câu trả lời sai.<br>
              Hệ thống sẽ đưa các câu này vào <strong>Vòng ${currentRound + 1}</strong> để lặp lại cho đến khi đúng hoàn toàn!
            </p>
            <button onclick="startNextRound()" style="margin-top: 20px;">Tiếp tục Vòng ${currentRound + 1}</button>
          </div>
        `;
      } else {
        // Hết câu sai -> Hoàn thành toàn bộ quy trình lặp, hiển thị điểm đánh giá cuối cùng
        showFinalResult();
      }
    }

    function startNextRound() {
      currentRound++;
      roundQuestions = [...nextRoundWrong]; // Đưa các câu sai thành bộ câu hỏi vòng mới
      nextRoundWrong = [];                 // Reset danh sách câu sai tạm thời
      cur = 0;
      roundCorrectCount = 0;
      showQ();
    }

    // ===== ĐÁNH GIÁ CUỐI CÙNG (Dựa trên % trung bình các vòng, không tính vòng cuối) =====
    function showFinalResult() {
      let scoreToEvaluate = [...roundStats];
      let evaluatedRoundsCount = scoreToEvaluate.length;

      let averageScore = 0;
      if (evaluatedRoundsCount > 1) {
        // Loại bỏ vòng cuối cùng (vòng hoàn hảo 100% sạch câu sai)
        scoreToEvaluate.pop();
        let sum = scoreToEvaluate.reduce((a, b) => a + b, 0);
        averageScore = Math.round(sum / scoreToEvaluate.length);
      } else {
        // Nếu ngay vòng 1 đã đúng hết không cần lặp thêm vòng nào
        averageScore = scoreToEvaluate[0];
      }

      let evaluationText = "";
      if (averageScore >= 90) evaluationText = "Xuất sắc! Nắm vững kiến thức cực kỳ tốt.";
      else if (averageScore >= 75) evaluationText = "Khá tốt! Kiến thức ổn định.";
      else if (averageScore >= 50) evaluationText = "Trung bình. Cần ôn tập và chú ý thêm các câu hỏi sai.";
      else evaluationText = "Cần cố gắng nhiều hơn trong việc ghi nhớ hệ thống câu hỏi.";

      let roundsDetailHTML = roundStats.map((sc, idx) => `
        <div style="display: flex; justify-content: space-between; padding: 6px 12px; background: rgba(255,255,255,0.03); margin-bottom: 6px; border-radius: 6px; font-size: 15px;">
          <span>Vòng ${idx + 1} ${idx === roundStats.length - 1 && roundStats.length > 1 ? '(Vòng tổng kết)' : ''}:</span>
          <strong style="color: #60a5fa;">${sc}%</strong>
        </div>
      `).join('');

      app.innerHTML = `
        <div style="text-align: center; padding: 10px;">
          <h2 style="font-size: 28px; margin-bottom: 15px;">🎉 Hoàn thành xuất sắc!</h2>
          <div style="background: #334155; padding: 20px; border-radius: 20px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.3)">
            <p style="font-size: 16px; margin: 0; color: #94a3b8;">Đánh giá trung bình các vòng thực tế:</p>
            <p style="font-size: 48px; font-weight: 800; margin: 10px 0; color: #fbbf24;">${averageScore}%</p>
            <p style="font-size: 14px; color: #38bdf8; margin-bottom: 15px;">${evaluationText}</p>
            
            <div style="border-top: 1px solid #475569; padding-top: 12px; text-align: left;">
              <p style="font-size: 14px; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-align: center;">Chi tiết các vòng làm bài:</p>
              ${roundsDetailHTML}
            </div>
          </div>
          <button onclick="resetApp()" style="margin-top: 20px;">Làm bài mới</button>
        </div>
      `;
    }

    function exitQuiz() {
      if (confirm("Tiến trình sẽ bị hủy. Bạn có muốn thoát?")) {
        startUI();
      }
    }

    function resetApp() {
      selectedChaps = ["c1"];
      startUI();
    }

    // ===== XỬ LÝ PHÍM TẮT ĐÁP ÁN (1, 2, 3, 4) =====
    document.addEventListener('keydown', function (event) {
      if (["1", "2", "3", "4"].includes(event.key)) {
        const optionIdx = parseInt(event.key) - 1;
        const options = document.querySelectorAll('.option');
        // Chỉ bấm được khi các lựa chọn chưa bị khóa (chưa chọn)
        if (options[optionIdx] && options[0].style.pointerEvents !== "none") {
          options[optionIdx].click();
        }
      }
    });

    // ===== RESPONSIVE CHECK =====
    function detectDesktop() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile && window.innerWidth > 768) {
        document.body.classList.add('is-desktop');
      } else {
        document.body.classList.remove('is-desktop');
      }
    }

    window.addEventListener('resize', detectDesktop);
    detectDesktop();

    // Khởi chạy ứng dụng ban đầu
    startUI();
  </script>
</body>

</html>
