<!DOCTYPE html>
<html lang="vi">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Quiz App</title>

  <style>
    /* Giao diện thanh nhảy câu hỏi bên trái */
    .quiz-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .quiz-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Thanh Nav bây giờ là một LAYER đè lên */
    .nav-panel {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      background: rgba(30, 41, 59, 0.95);
      /* Màu nền đậm có độ trong suốt nhẹ */
      padding: 20px;
      border-radius: 15px;

      /* BIẾN THÀNH LAYER ĐÈ LÊN */
      position: absolute;
      top: 50px;
      left: 0;
      z-index: 999;
      /* Đảm bảo luôn nằm trên cùng */

      width: 280px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #3b82f6;
      backdrop-filter: blur(5px);
      /* Làm mờ nhẹ nền phía dưới layer */
    }

    /* Khi đóng layer */
    .nav-panel.collapsed {
      display: none;
    }

    /* Nút đóng/mở layer */
    .toggle-nav-btn {
      background: #3b82f6;
      color: white;
      padding: 8px 15px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
      display: inline-block;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }

    /* TRẠNG THÁI 1: Mặc định chưa làm - Màu Xám */
    .nav-item {
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #334155;
      /* Màu xám tro */
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    /* Viền vàng cho câu đang xem */
    .nav-item.active {
      outline: 2px solid #fbbf24;
      z-index: 1;
    }

    /* TRẠNG THÁI 2: Đã chọn đáp án (Đang thi) - Màu Xanh nước biển */
    .nav-item.done {
      background: #2563eb !important;
      color: #ffffff !important;
      border-color: #60a5fa !important;
    }

    /* TRẠNG THÁI 3: Đã nộp bài - Màu Xanh lá (Đúng) / Đỏ (Sai) */
    .nav-item.correct {
      background: #064e3b !important;
      color: #a7f3d0 !important;
      border-color: #10b981 !important;
    }

    .nav-item.wrong {
      background: #7f1d1d !important;
      color: #fecaca !important;
      border-color: #ef4444 !important;
    }

    /* Đồng hồ đếm ngược */
    #timer {
      font-size: 24px;
      font-weight: bold;
      color: #ef4444;
      text-align: center;
      margin-bottom: 15px;
      font-family: monospace;
      /* Thêm dòng dưới đây để giữ chỗ cố định */
      min-height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Nút điều hướng Tiến/Lùi */
    .nav-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .nav-btns button {
      flex: 1;
      background: #475569;
    }

    /* Option dạng Checkbox giả */
    .option.selected {
      border-color: #3b82f6;
      background: #1e3a8a;
    }

    /* Thanh tiến trình chạy ở phía trên cùng của Card */
    .progress-container {
      width: 100%;
      background-color: #334155;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(to right, #3b82f6, #60a5fa);
      width: 0%;
      /* Sẽ cập nhật bằng JS */
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 14px;
      color: #94a3b8;
      text-align: right;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .hover-word {
      display: inline-block;
      transition: all 0.2s ease-in-out;
      transform-origin: center center;
      margin: 0 1px;
      letter-spacing: normal;
      /* Khoảng cách chữ cái mặc định */
    }

    @media (hover: hover) {
      .hover-word:hover {
        transform: scale(1.2) translateY(-2px);
        color: #60a5fa;
        margin: 0 6px;
        /* Giãn cách giữa các từ */

        /* 🌟 ĐÂY LÀ DÒNG GIÃN CÁCH CÁC CHỮ CÁI BÊN TRONG TỪ 🌟 */
        letter-spacing: 1.5px;

        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        cursor: default;
      }
    }

    /* =========================================
   BỔ SUNG: GIAO DIỆN FULL MÀN HÌNH CHO MÁY TÍNH (DESKTOP)
   ========================================= */
    /* Khi thẻ body có class 'is-desktop' (do JS gắn vào) */
    .is-desktop .card {
      max-width: 96%;
      width: 100%;
      min-height: 90vh;
      padding: 40px 50px;
    }

    /* Khung chứa các đáp án */
    .is-desktop #ans {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 30px;
    }

    .is-desktop .option {
      margin: 0;
      height: 100%;
      padding: 24px;
      font-size: 18px;
    }

    /* Thêm gợi ý phím tắt mờ nhạt ở góc phải của đáp án khi dùng máy tính */
    .is-desktop .option:nth-child(1)::after {
      content: "Phím 1";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    .is-desktop .option:nth-child(2)::after {
      content: "Phím 2";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    .is-desktop .option:nth-child(3)::after {
      content: "Phím 3";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    .is-desktop .option:nth-child(4)::after {
      content: "Phím 4";
      float: right;
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-left: auto;
    }

    /* Tùy chỉnh thêm khoảng cách của câu hỏi cho cân đối với khung to */
    .is-desktop .q {
      font-size: 24px;
      margin-bottom: 30px;
    }

    * {
      box-sizing: border-box
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      /* Nền web màu xanh đen cực đậm */
      color: #f8fafc;
      /* Màu chữ xám trắng */
      margin: 0;
      padding: 0;
    }

    .q {
      font-size: 27px;
      font-weight: 600;
      line-height: 1.5;
      margin: 20px 0 15px;
      padding: 10px 0;
      color: #f8fafc;
      /* Chữ câu hỏi màu trắng/xám sáng */
    }

    /* Hiệu ứng phóng to và nổi bật khi di chuột vào đáp án (Chỉ hoạt động trên thiết bị có chuột) */
    @media (hover: hover) {
      .option:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        /* Bóng đổ đậm hơn cho dark mode */
        border-color: #64748b;
        /* Viền sáng lên một chút khi hover */
        background: #334155;
        /* Nền khối đáp án sáng lên nhẹ khi hover */
      }
    }

    /* FULL MOBILE CARD */
    .card {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #1e293b;
      /* Nền khung làm bài xanh đen nhạt hơn nền web 1 xíu để tách biệt */
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* TITLE */
    h2 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 15px;
      color: #f8fafc;
    }

    /* CHAPTER BUTTON */
    .chaps {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .chap {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      background: #334155;
      /* Khối chương chưa chọn màu xám tro */
      color: #94a3b8;
      /* Chữ xám nhạt */
      border: 2px solid #475569;
      border-radius: 12px;
      font-size: 23px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chap.active {
      background: #1e3a8a;
      /* Xanh dương đậm khi active */
      color: #60a5fa;
      /* Chữ xanh dương sáng */
      border: 2px solid #3b82f6;
      /* Viền xanh dương dạ quang */
    }

    /* SLIDER */
    .slider-wrap {
      position: relative;
      margin: 30px 0;
    }

    #slider {
      width: 100%;
      height: 10px;
      border-radius: 10px;
      appearance: none;
      background: #334155;
      /* Thanh trượt nền tối */
    }

    #slider::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #3b82f6;
      /* Nút trượt xanh dương chói */
      cursor: pointer;
      margin-top: -6px;
    }

    /* VALUE FLOAT */
    #val {
      position: absolute;
      top: -32px;
      transform: translateX(-50%);
      background: #3b82f6;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    /* OPTIONS */
    .option {
      background: #1e293b;
      /* Nền khối đáp án đồng màu với Card */
      color: #cbd5e1;
      /* Chữ đáp án xám trắng */
      padding: 18px 16px;
      margin: 14px 0;
      border-radius: 18px;
      font-size: 26px;
      line-height: 1.4;
      min-height: 150px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: 0.15s;
      border: 2px solid #334155;
      /* Viền phân cách xám đen */
    }

    /* hiệu ứng bấm */
    .option:active {
      transform: scale(0.97);
    }

    .option.correct {
      background: #064e3b;
      /* Nền xanh lục sẫm khi đúng */
      color: #a7f3d0;
      /* Chữ xanh lợt khi đúng */
      border-color: #10b981;
      /* Viền xanh dạ quang */
    }

    .option.wrong {
      background: #7f1d1d;
      /* Nền đỏ bầm khi sai */
      color: #fecaca;
      /* Chữ hồng nhạt khi sai */
      border-color: #ef4444;
      /* Viền đỏ chót */
    }

    /* BUTTON */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 16px;
      background: #3b82f6;
      /* Nút xanh dương dạ quang */
      color: white;
      font-size: 23px;
      font-weight: bold;
      cursor: pointer;
    }

    /* SAFE AREA (iphone) */
    @supports(padding:max(0px)) {
      .card {
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
    }

    /* Bộ nút điều hướng cố định ở đáy màn hình */
    .nav-btns-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 15px;
      padding: 15px 20px;
      z-index: 1000;
      /* Luôn nằm trên cùng */
      max-width: 800px;
      margin: 0 auto;
    }

    .nav-btns-fixed button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      background: #475569;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    /* Thêm khoảng trống ở dưới cùng của nội dung câu hỏi để không bị nút đè lên chữ cuối */
    .quiz-main-content {
      padding-bottom: 100px;
    }

    .exit-btn {
      position: absolute;
      top: 0px;
      left: 0px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }

    .exit-btn:hover {
      background: #dc2626;
      transform: scale(1.05);
    }

    .exit-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>

  <script>
    document.addEventListener('keydown', function (event) {
      if (!isExam && !isFinished) return;
      const options = document.querySelectorAll('.option');
      const isAnswered = document.querySelector('.option.correct') || document.querySelector('.option.wrong');

      // Chuyển đổi phím bấm thành chữ thường để tránh lỗi Caps Lock
      const key = event.key.toLowerCase();

      // --- PHÍM TẮT MỚI GÁN THEO YÊU CẦU ---
      if (key === 'q') {
        toggleNav(); // Mở/Đóng Layer Nav
      }
      if (key === 'w') {
        prevQ(); // Lùi câu
      }
      if (key === 'e') {
        nextQ(); // Tiến câu
      }

      // --- CHỌN ĐÁP ÁN (1, 2, 3, 4) ---
      if (options.length === 4 && !isAnswered && !isFinished) {
        if (key === '1') options[0].click();
        if (key === '2') options[1].click();
        if (key === '3') options[2].click();
        if (key === '4') options[3].click();
      }

      // Bấm Enter để bắt đầu hoặc làm lại
      if (event.key === 'Enter') {
        const btn = document.querySelector('button');
        if (btn && (btn.innerText.includes('Bắt đầu') || btn.innerText.includes('Làm lại'))) {
          btn.click();
        }
      }
    });

    // ===== TOGGLE CHAPTER =====
    function toggleChap(key, el) {
      if (selectedChaps.includes(key)) {

        el.classList.remove("active");

        selectedChaps.push(key);
        el.classList.add("active");
      }

    // ===== UPDATE SLIDER =====
    function updateSlider() {
      const slider = document.getElementById("slider");
      const val = document.getElementById("val");

      if (!slider) return;

      let totalQ = 0;
      selectedChaps.forEach(c => totalQ += qBank[c].length);

      let minQ = selectedChaps.length || 1;

      slider.min = minQ;
      slider.max = totalQ || 1;

      // SỬA LỖI: Ép kiểu sang Số (Number) trước khi so sánh
      if (Number(slider.value) < minQ) {
        slider.value = minQ;
      } else if (Number(slider.value) > totalQ) {
        slider.value = totalQ;
      }

      move();
      slider.oninput = move;

      function move() {
        // SỬA LỖI: Ép kiểu sang Số (Number) trước khi so sánh
        if (Number(slider.value) < Number(slider.min)) {
          slider.value = slider.min;
        }

        const percent = (slider.value - slider.min) / (slider.max - slider.min || 1);

        val.innerText = slider.value;

        const w = slider.offsetWidth;
        const thumb = 24; // Đã chỉnh lại 24px cho khớp với giao diện CSS mới
        const x = percent * (w - thumb) + thumb / 2;

        val.style.left = x + "px";

        // Cập nhật lại màu sắc thanh gạt khớp với giao diện xanh hiện đại
        slider.style.background =
          `linear-gradient(to right,#3b82f6 ${percent * 100}%,#e2e8f0 ${percent * 100}%)`;
      }
    }

    // ===== START =====

        alert("Phải chọn ít nhất 1 chương");

      selectedChaps.forEach(c => { pool = pool.concat(qBank[c]); });

      qs = shuffle(pool).slice(0, num);

      }

      let timerValue = isFinished ? `Kết quả: ${correct} / ${qs.length}` : timeStr;

      </button>

      ${(isExam || isFinished) ? `

          </div>
          ${renderNavItems(isFinished)}
        </div>` : ""}
      
      <div class="quiz-main-content">${mainContent}</div>
      ${navButtonsHTML}
    </div>
  `;

      // Render Options (giữ nguyên logic cũ của bạn)
      const box = document.getElementById("ans");
      const letters = ["A", "B", "C", "D"];
      opts.forEach((t, i) => {
        const d = document.createElement("div");
        d.className = "option";
        if (isFinished) {
          if (i + 1 === ansRaw) d.classList.add("correct");
          if (userAnswers[cur] === i + 1 && i + 1 !== ansRaw) d.classList.add("wrong");
        } else if (isExam && userAnswers[cur] === i + 1) {
          d.classList.add("selected");

        d.innerText = `${letters[i]}. ${t}`;
        d.onclick = () => {

          userAnswers[cur] = i + 1;

            document.querySelectorAll(".option").forEach(el => el.style.pointerEvents = "none");

      if (confirm(msg)) {
        // Dừng đồng hồ
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        // Reset toàn bộ biến trạng thái

      isNavOpen = !isNavOpen;
      showQ();
    }

    // Hàm render danh sách câu hỏi (Thanh Nav)
    function renderNavItems(finished) {
      return qs.map((q, i) => {
        let statusClass = ""; // Mặc định là nav-item (màu xám)

        if (finished) {
          statusClass = (userAnswers[i] === q[2]) ? 'correct' : 'wrong';
        } else if (userAnswers[i] !== null) {
          statusClass = 'done'; // Xanh nước biển
        }

        return `<div class="nav-item ${statusClass} ${cur === i ? 'active' : ''}"

        // Thêm isNavOpen=false để tự đóng layer sau khi chọn câu
      }).join('');
    }
    function selectAnswer(ansIdx) {

    function nextQ() { if (cur < qs.length - 1) { cur++; showQ(); } }

    function finishExam() {

      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // Nếu không phải Mobile VÀ chiều rộng màn hình > 768px -> Đích thị là máy tính
      if (!isMobile && window.innerWidth > 768) {
        document.body.classList.add('is-desktop'); // Gắn class kích hoạt CSS Desktop

        document.body.classList.remove('is-desktop');

      const options = document.querySelectorAll('.option');

      // Kiểm tra xem người dùng đã chọn đáp án chưa (tránh tình trạng bấm phím 2 lần hoặc bấm khi app đang tự động chuyển câu)
      const isAnswered = document.querySelector('.option.correct') || document.querySelector('.option.wrong');

      // Nếu đang ở màn hình có đúng 4 đáp án và chưa trả lời
      if (options.length === 4 && !isAnswered) {
        switch (event.key) {
          case '1': // Tương ứng phím 1 -> A
            options[0].click();
            break;
          case '2': // Tương ứng phím 2 -> B
            options[1].click();
            break;
          case '3': // Tương ứng phím 3 -> C
            options[2].click();
            break;
          case '4': // Tương ứng phím 4 -> D
            options[3].click();
            break;
        }
      }

      // Mở rộng thêm: Bấm Enter để bắt đầu làm bài hoặc làm lại
      if (event.key === 'Enter') {
        const btn = document.querySelector('button');

    }
    function finishExam() {
      // Kiểm tra chưa làm hết... (giữ nguyên logic cũ của bạn)
      if (userAnswers.includes(null)) {
        alert("Chưa làm hết bài!");
        return;
      }
      if (!confirm("Xác nhận nộp bài?")) return;
      clearInterval(timerInterval);
      timerInterval = null;
      isFinished = true; // CHUYỂN TRẠNG THÁI TẠI ĐÂY

      // Tính điểm
      correct = 0;
      qs.forEach((q, i) => { if (userAnswers[i] === q[2]) correct++; });

      cur = 0; // Quay lại câu 1 để xem lại
      showQ();
    }
    // Lắng nghe sự kiện người dùng định đóng hoặc làm mới trang
    window.addEventListener('beforeunload', function (e) {
      // Chỉ kích hoạt cảnh báo nếu đang ở chế độ thi (isExam) và chưa nộp bài (!isFinished)
      if (1) {
        // Thông báo tiêu chuẩn của trình duyệt (đa số trình duyệt hiện đại sẽ dùng thông báo mặc định riêng)
        const confirmationMessage = 'Ai biết à????';

        e.returnValue = confirmationMessage; // Quy định của một số trình duyệt cũ
        return confirmationMessage; // Quy định của trình duyệt hiện đại
      }
    });
  </script>
